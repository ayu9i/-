<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detective Conan: The Infinite Loop</title>
    <style>
        :root {
            --primary: #d4af37;
            --primary-hover: #aa841b;
            --bg-dark: #0a0a0c;
            --panel-bg: #141419;
            --text-light: #f5f5f7;
            --text-muted: #8e8e93;
            --accent: #e63946;
            --font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: var(--font-family);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            perspective: 1000px;
        }

        #game-container {
            width: 900px;
            height: 600px;
            background: linear-gradient(135deg, #16161d 0%, #0b0b0d 100%);
            border: 2px solid var(--primary);
            border-radius: 16px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(212, 175, 55, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            transition: all 0.5s ease;
        }

        #header {
            padding: 20px 40px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(20, 20, 25, 0.8);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        #brand {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--primary);
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        #stats {
            display: flex;
            gap: 30px;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .stat-item {
            padding: 6px 16px;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
        }

        .stat-value {
            color: var(--primary);
            font-weight: bold;
        }

        #main-content {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        #visual-panel {
            flex: 1.2;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            border-right: 1px solid rgba(212, 175, 55, 0.15);
            background: radial-gradient(circle at center, #1f1f27 0%, #0a0a0c 100%);
            overflow: hidden;
        }

        #visual-panel::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: radial-gradient(rgba(212, 175, 55, 0.05) 1px, transparent 0);
            background-size: 24px 24px;
            animation: bgMove 60s linear infinite;
        }

        @keyframes bgMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-50px, -50px); }
        }

        #conan-character {
            width: 180px;
            height: 260px;
            position: relative;
            z-index: 2;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .conan-suit {
            width: 100%;
            height: 100%;
            background: #1d3557;
            border-radius: 40px 40px 10px 10px;
            border: 3px solid var(--primary);
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .conan-glasses {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 130px;
            height: 45px;
            display: flex;
            justify-content: space-between;
            z-index: 5;
        }

        .lens {
            width: 60px;
            height: 45px;
            border: 4px solid var(--primary);
            background: rgba(255, 255, 255, 0.75);
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5), inset 0 0 10px rgba(255,255,255,1);
            position: relative;
            overflow: hidden;
        }

        .lens::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 45%, rgba(255,255,255,0.8) 50%, transparent 55%);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: translate(-30px, -30px); }
            100% { transform: translate(30px, 30px); }
        }

        .conan-bowtie {
            position: absolute;
            top: 110px;
            left: 50%;
            transform: translateX(-50%);
            width: 55px;
            height: 30px;
            background: var(--accent);
            border-radius: 6px;
            z-index: 4;
            box-shadow: 0 4px 10px rgba(230, 57, 70, 0.4);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .conan-bowtie:hover {
            transform: translateX(-50%) scale(1.1);
        }

        .conan-bowtie::before, .conan-bowtie::after {
            content: '';
            position: absolute;
            top: -5px;
            width: 30px;
            height: 40px;
            background: var(--accent);
            border-radius: 8px;
        }

        .conan-bowtie::before { left: -20px; transform: rotate(-20px); }
        .conan-bowtie::after { right: -20px; transform: rotate(20px); }

        #story-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--panel-bg);
            padding: 40px;
            justify-content: space-between;
            position: relative;
        }

        #dialogue-box {
            font-size: 16px;
            line-height: 1.8;
            color: var(--text-light);
            letter-spacing: 0.5px;
            height: 220px;
            overflow-y: auto;
            padding-right: 10px;
        }

        #dialogue-box::-webkit-scrollbar {
            width: 4px;
        }

        #dialogue-box::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 2px;
        }

        #speaker-name {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--primary);
            margin-bottom: 12px;
            font-weight: bold;
        }

        #options-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 20px;
        }

        .option-btn {
            background: transparent;
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: var(--text-light);
            padding: 14px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            text-align: left;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover {
            border-color: var(--primary);
            background: rgba(212, 175, 55, 0.08);
            color: var(--primary);
            padding-left: 30px;
        }

        .option-btn::before {
            content: '◆';
            position: absolute;
            left: 12px;
            color: var(--primary);
            opacity: 0;
            transition: all 0.3s;
        }

        .option-btn:hover::before {
            opacity: 1;
        }

        #sleeping-kogoro {
            position: absolute;
            bottom: -20px;
            left: 30px;
            width: 14px;
            height: 14px;
            background: #e63946;
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
        }

        .laser-glow {
            animation: laserBeam 0.5s forwards;
        }

        @keyframes laserBeam {
            0% { transform: scale(1); opacity: 1; box-shadow: 0 0 20px #e63946; }
            100% { transform: translate(300px, -100px) scale(0.1); opacity: 0; }
        }

        .shocked {
            animation: shockAnim 0.4s ease-in-out infinite alternate;
        }

        @keyframes shockAnim {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(0px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(2px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(2px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(1deg); }
        }

        #screen-effect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            transition: background 0.3s;
        }

        .flash-red {
            background: rgba(230, 57, 70, 0.3);
        }

        #footer-credits {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.15);
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="screen-effect"></div>
        
        <div id="header">
            <div id="brand">Case File: 980</div>
            <div id="stats">
                <div class="stat-item">คดีที่: <span id="case-counter" class="stat-value">1</span></div>
                <div class="stat-item">ความน่าเชื่อถือ: <span id="cred-counter" class="stat-value">100%</span></div>
            </div>
        </div>

        <div id="main-content">
            <div id="visual-panel">
                <div id="conan-character">
                    <div class="conan-suit">
                        <div class="conan-glasses">
                            <div class="lens"></div>
                            <div class="lens"></div>
                        </div>
                        <div class="conan-bowtie" id="bowtie-trigger" onclick="clickBowtie()"></div>
                    </div>
                </div>
                <div id="sleeping-kogoro"></div>
            </div>

            <div id="story-panel">
                <div>
                    <div id="speaker-name">ระบบสืบสวนอัจฉริยะ</div>
                    <div id="dialogue-box">
                        ยินดีต้อนรับสู่คดีปริศนาอันหรูหรา... คุณตื่นขึ้นมาในห้องปิดตายสีดำทองอร่ามอันหรูหราหมาเห่า มีศพนอนอยู่ตรงกลางห้อง และข้างๆ คุณมีลุงโมริที่กำลังยืนเกาพุงอยู่ คุณต้องหาทางปิดคดีนี้ให้ได้!
                    </div>
                </div>

                <div id="options-container">
                    <!-- Options injected via JavaScript -->
                </div>
            </div>
        </div>
        
        <div id="footer-credits">Conan Premium Paradox System &copy; 2026</div>
    </div>

    <script>
        let currentStage = 'start';
        let caseCount = 1;
        let credibility = 100;
        
        const dialogueBox = document.getElementById('dialogue-box');
        const speakerName = document.getElementById('speaker-name');
        const optionsContainer = document.getElementById('options-container');
        const caseCounter = document.getElementById('case-counter');
        const credCounter = document.getElementById('cred-counter');
        const conanChar = document.getElementById('conan-character');
        const screenEffect = document.getElementById('screen-effect');

        const storyData = {
            start: {
                speaker: "ระบบสืบสวนอัจฉริยะ",
                text: "คุณมองไปรอบๆ ห้องจัดแสดงเพชรราคา 10,000 ล้านเยน มีร่องรอยการต่อสู้ และมีผู้ต้องสงสัย 3 คนยืนทำหน้าเลิ่กลั่กอยู่ คุณจะเริ่มสืบจากอะไรก่อนดี?",
                options: [
                    { text: "เดินไปตรวจดูศพเพื่อหาหลักฐานตามหลักนิติวิทยาศาสตร์", next: "inspect_body" },
                    { text: "ยิงยาสลบใส่ลุงโมริทันทีเพื่อความรวดเร็วในการปิดคดี", next: "shoot_kogoro" },
                    { text: "ชวนผู้ต้องสงสัยกินข้าวเหนียวมะม่วงเพื่อละลายพฤติกรรม", next: "mango_sticky" }
                ]
            },
            inspect_body: {
                speaker: "เอโดงาวะ โคนัน",
                text: "จากการตรวจสอบศพ... ศพเสียชีวิตมาแล้วประมาณ 2 ชั่วโมง แต่เอ๊ะ! ในมือของศพกำ 'เศษผ้าสีดำ' เอาไว้ และมีกลิ่นเหล้ายินโชยออกมาชวนให้คิดถึงองค์กรชุดดำชะมัด!",
                options: [
                    { text: "ประกาศกร้าวว่า 'ชายชุดดำเป็นคนทำแน่นอน!'", next: "blame_black" },
                    { text: "หันไปถามลุงโมริว่ามีความคิดเห็นยังไงบ้างครับ", next: "ask_kogoro" }
                ]
            },
            shoot_kogoro: {
                speaker: "ระบบสืบสวน",
                text: "ฟิ้ววว! เข็มยาสลบพุ่งออกจากนาฬิกา ปักเข้าที่ต้นคอของโมริ โคโกโร่ อย่างแม่นยำ ลุงแกหมุนตัว 3 รอบครึ่งก่อนจะลงไปนั่งสลบบนเก้าอี้โซฟาอย่างหรูหรา ท่าสวยมาก แต่คุณยังไม่มีหลักฐานอะไรเลยนะ!!",
                options: [
                    { text: "ช่างหลักฐานมัน มโนบทพูดเท่ๆ แล้วใช้หูกระต่ายเปลี่ยนเสียงโม้เลย", next: "fake_deduction" },
                    { text: "ฉวยโอกาสนี้เดินไปค้นกระเป๋าผู้ต้องสงสัยแทน", next: "search_suspects" }
                ]
            },
            mango_sticky: {
                speaker: "ผู้ต้องสงสัยทั้งหมด",
                text: "พวกเรากำลังเครียดเรื่องคดีฆาตกรรมอยู่ แต่กะทิเยิ้มๆ และมะม่วงน้ำดอกไม้ที่นี่มันช่างหอมหวานหรูหราเหลือเกิน... อร่อยจนลืมไปเลยว่าใครเป็นคนฆ่า แต่อยู่ดีๆ ทุกคนก็ท้องเสียพร้อมกันเพราะคุณลืมแช่ตู้เย็น!",
                options: [
                    { text: "อาศัยจังหวะที่ทุกคนวิ่งไปเข้าห้องน้ำ แอบปิดคดีแบบเนียนๆ", next: "loop_case" }
                ]
            },
            blame_black: {
                speaker: "สารวัตรเมงูเระ",
                text: "โคนันคุง... ชายชุดดำไหนของเธอ? ที่นี่มันงานประกวดแฟชั่นผ้าไหมสีดำนะ ทุกคนในงานก็ใส่ชุดดำกันหมดทั้งตึกเลยเนี่ย! เลิกมโนแล้วไปนั่งนิ่งๆ ไป๊!",
                options: [
                    { text: "หน้าแตก... ขอย้อนกลับไปตั้งสติใหม่", next: "loop_case" }
                ]
            },
            ask_kogoro: {
                speaker: "โมริ โคโกโร่",
                text: "ฮ่าๆๆ โคนันคุง! คดีนี้มันง่ายมาก ผู้ตายฆ่าตัวตายโดยการเอาเศษผ้าอุดจมูกตัวเองยังไงล่ะ!! เพื่อประชดประชันที่ซื้อผ้าผิดสี!",
                options: [
                    { text: "เพลียจิตกับตรรกะลุง... ยิงยาสลบใส่แกซะเถอะ", next: "shoot_kogoro" }
                ]
            },
            fake_deduction: {
                speaker: "โมริ โคโกโร่ (เสียงโคนัน)",
                text: "คนร้ายก็คือ... คุณนั่นแหละ! เพราะคุณพกเชือกยาว 2 เมตรในกระเป๋าเสื้อที่กว้างแค่ 5 เซนติเมตร มันเป็นไปไม่ได้ในทางฟิสิกส์ เว้นแต่คุณจะเป็นโดเรมอน!!",
                options: [
                    { text: "ผู้ต้องสงสัยยอมรับสารภาพพร้อมร้องไห้ฟูมฟาย", next: "win_game" },
                    { text: "ผู้ต้องสงสัยแย้งว่า 'นั่นมันสายชาร์จไอโฟนโว้ย!'", next: "fail_case" }
                ]
            },
            search_suspects: {
                speaker: "ระบบสืบสวน",
                text: "คุณพบขวดยาพิษ APTX-4869 อยู่ในกระเป๋าของคุณนายไฮโซ แต่เธอบอกว่าเป็นยาคอลลาเจนสูตรลดอายุเข้มข้น ทานแล้วหน้าเด็กเหมือนอายุ 7 ขวบตลอดกาล",
                options: [
                    { text: "รีบขอแบ่งมากิน เผื่อจะได้โตเป็นคุโด้ ชินอิจิ สักที", next: "loop_case" },
                    { text: "จับกุมเธอทันทีในข้อหามียาที่ยังไม่ผ่าน อย.", next: "win_game" }
                ]
            },
            fail_case: {
                speaker: "ระบบสืบสวน",
                text: "การวิเคราะห์ของคุณมั่วซั่วเกินไป ความน่าเชื่อถือของนักสืบชื่อดังลดลงอย่างฮวบฮาบ ลุงโมริตื่นขึ้นมาตบหัวคุณทิ่ม!",
                options: [
                    { text: "มึนตึ้บ... เริ่มต้นใหม่อีกครั้ง", next: "loop_case" }
                ]
            },
            win_game: {
                speaker: "ระบบสืบสวน",
                text: "ยินดีด้วย! คุณสามารถปิดคดีอันหรูหราราคาแพงนี้ได้อย่างงดงาม สารวัตรเมงูเระตบมือรัวๆ... แต่ทันใดนั้น มีเสียงระเบิดดังขึ้นจากมุมตึก และเหล้าวอดก้าก็ตกอยู่ข้างๆ คุณ!",
                options: [
                    { text: "วิ่งตามเงาชายชุดดำไป... สู่คดีถัดไปไม่มีวันสิ้นสุด!", next: "loop_case" }
                ]
            },
            loop_case: {
                speaker: "Time Loop Tracker",
                text: "และแล้ว... คดีเก่าก็ผ่านไป คดีใหม่ก็งอกขึ้นมาทันทีราวกับดอกเห็ด คุณไม่มีวันโตเป็นผู้ใหญ่ และไม่มีวันเรียนจบชั้นประถม 1... ยินดีต้อนรับสู่คดีถัดไป!",
                options: [
                    { text: "เริ่มคดีใหม่แบบกวนๆ ต่อไป", next: "start" }
                ]
            }
        };

        function renderStage(stageKey) {
            currentStage = stageKey;
            const stage = storyData[stageKey];
            
            if (stageKey === 'loop_case') {
                caseCount++;
                caseCounter.innerText = caseCount;
                credibility = Math.max(10, credibility - 5);
                credCounter.innerText = credibility + "%";
                triggerFlash();
            }

            if (stageKey === 'fail_case') {
                credibility = Math.max(0, credibility - 30);
                credCounter.innerText = credibility + "%";
                conanChar.classList.add('shocked');
                setTimeout(() => conanChar.classList.remove('shocked'), 1000);
            }

            speakerName.innerText = stage.speaker;
            dialogueBox.innerText = stage.text;
            optionsContainer.innerHTML = '';

            stage.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.text;
                btn.onclick = () => renderStage(opt.next);
                optionsContainer.appendChild(btn);
            });
        }

        function clickBowtie() {
            conanChar.style.transform = 'scale(1.1) rotate(5deg)';
            setTimeout(() => { conanChar.style.transform = 'scale(1) rotate(0deg)'; }, 200);
            
            const laser = document.getElementById('sleeping-kogoro');
            laser.style.opacity = '1';
            laser.classList.add('laser-glow');
            
            setTimeout(() => {
                laser.classList.remove('laser-glow');
                laser.style.opacity = '0';
            }, 500);

            if (currentStage === 'start' || currentStage === 'inspect_body') {
                renderStage('shoot_kogoro');
            }
        }

        function triggerFlash() {
